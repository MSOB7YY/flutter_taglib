name: Build Native Assets

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - custom_taglib
    paths:
      - pubspec.yaml

jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_build: ${{ steps.version.outputs.should_build }}

    steps:
      - uses: actions/checkout@v4

      - name: Read pubspec version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(awk '/^version:/ { sub(/\r$/, "", $2); print $2; exit }' pubspec.yaml)"
          tag="v${version}"
          if ! grep -q "_prebuiltReleaseTag = '${tag}'" hook/build.dart; then
            echo "::error file=hook/build.dart::_prebuiltReleaseTag must be '${tag}' to match pubspec.yaml"
            exit 1
          fi
          should_build=true
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists, skipping."
            should_build=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            flutter-build-command: flutter build windows --release
            output-name: flutter_taglib_windows_x64.dll
            search-pattern: flutter_taglib_native.dll
          - platform: linux-x64
            os: ubuntu-22.04
            flutter-build-command: flutter build linux --release
            output-name: libflutter_taglib_linux_x64.so
            search-pattern: libflutter_taglib_native.so

    env:
      FLUTTER_TAGLIB_BUILD_DESKTOP_FROM_SOURCE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libcurl4-openssl-dev unzip

      - name: Flutter pub get
        run: flutter pub get

      - name: Enable desktop source build marker
        shell: bash
        run: |
          touch .flutter_taglib_build_desktop_from_source

      - name: Build desktop example
        working-directory: example
        run: ${{ matrix.flutter-build-command }}

      - name: Debug native asset outputs
        shell: bash
        run: |
          echo "Searching for native asset outputs..."
          find . -path '*native_assets*' | sort || true
          find . -name '*taglib*.so' -o -name '*taglib*.dll' | sort || true

      - name: Collect Windows asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $file = Get-ChildItem -Path example/build/windows/x64/runner/Release -Recurse -Filter "${{ matrix.search-pattern }}" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $file) {
            $file = Get-ChildItem -Path example/build/windows/x64 -Recurse -Filter "${{ matrix.search-pattern }}" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $file) {
            $file = Get-ChildItem -Path example/build/windows/x64 -Recurse -Include "*taglib*.dll" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $file) { throw "Could not find ${{ matrix.search-pattern }}" }
          Copy-Item $file.FullName "dist/${{ matrix.output-name }}"

      - name: Debug Windows outputs
        if: runner.os == 'Windows' && failure()
        shell: pwsh
        run: |
          Write-Host "Listing candidate Windows outputs:"
          if (Test-Path example/build/windows/x64) {
            Get-ChildItem -Path example/build/windows/x64 -Recurse -Include *.dll -File -ErrorAction SilentlyContinue |
              Sort-Object FullName |
              ForEach-Object { $_.FullName }
          } else {
            Write-Host "example/build/windows/x64 does not exist"
          }

      - name: Collect Linux asset
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          file_path="$(find example/build/linux/x64/release/bundle/lib -name '${{ matrix.search-pattern }}' | head -n 1)"
          if [ -z "$file_path" ]; then
            file_path="$(find example/build/linux/x64/release -path '*native_assets*' -name '${{ matrix.search-pattern }}' | head -n 1)"
          fi
          if [ -z "$file_path" ]; then
            echo "Could not find ${{ matrix.search-pattern }}"
            echo "Listing candidate Linux outputs:"
            find example/build/linux/x64/release -maxdepth 8 \( -name '*.so' -o -path '*native_assets*' \) | sort
            exit 1
          fi
          cp "$file_path" "dist/${{ matrix.output-name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.output-name }}

  build-android:
    name: Build Android
    needs: version
    if: needs.version.outputs.should_build == 'true'
    runs-on: ubuntu-22.04

    env:
      FLUTTER_TAGLIB_BUILD_ANDROID_FROM_SOURCE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Enable android source build marker
        shell: bash
        run: |
          touch .flutter_taglib_build_android_from_source

      - name: Build Android APK
        working-directory: example
        run: flutter build apk --release

      - name: Debug Android outputs
        shell: bash
        run: |
          echo "Searching for Android native asset outputs..."
          find . -name 'libflutter_taglib_native.so' | sort || true

      - name: Collect Android assets
        shell: bash
        run: |
          mkdir -p dist
          find example/build/app/intermediates/stripped_native_libs/release/ -name 'libflutter_taglib_native.so' | while read -r file; do
            abi=$(basename "$(dirname "$file")")
            cp "$file" "dist/libflutter_taglib_android_${abi}.so"
            echo "Collected $abi binary: dist/libflutter_taglib_android_${abi}.so"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: dist/libflutter_taglib_android_*.so

  publish-release:
    name: Publish Release Assets
    needs: [version, build-desktop, build-android]
    runs-on: ubuntu-22.04

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/*/*
